name: CI

on:
  push:
    branches: ["main", "feat/**", "fix/**", "chore/**"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # 1. OpenAPI lint
  # ─────────────────────────────────────────────
  lint-openapi:
    name: Lint OpenAPI spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install Redocly CLI
        run: npm install -g @redocly/cli@1.x
      - name: Lint docs/openapi.yaml
        run: npx @redocly/cli lint docs/openapi.yaml --format=stylish

  # ─────────────────────────────────────────────
  # 2. JSON Schema validation
  # ─────────────────────────────────────────────
  validate-schemas:
    name: Validate JSON Schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate events.schema.json is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('schemas/events.schema.json','utf8')); console.log('events.schema.json OK')"
      - name: Validate all API payload schemas
        run: node scripts/test-api-schemas.js
      - name: Check all schema files parse as valid JSON
        run: |
          for f in schemas/api/*.schema.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8')); console.log('OK: $f')"
          done

  # ─────────────────────────────────────────────
  # 3. Analytics event schema smoke
  # ─────────────────────────────────────────────
  validate-events:
    name: Validate analytics event fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Smoke-validate event fixtures (if any)
        run: |
          if [ -d test/fixtures/events ]; then
            for f in test/fixtures/events/*.json; do
              node scripts/validate-event.js "$f"
            done
          else
            echo "No event fixtures found — skipping"
          fi

  # ─────────────────────────────────────────────
  # 4. Release artefact completeness
  # ─────────────────────────────────────────────
  artefact-check:
    name: Release artefact check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run release readiness checker (artefacts only)
        run: python3 scripts/check_release_readiness.py --no-color

  # ─────────────────────────────────────────────
  # 5. Shell script lint (ShellCheck)
  # ─────────────────────────────────────────────
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck
      - name: Lint shell scripts
        run: |
          shellcheck scripts/smoke-test.sh
          shellcheck scripts/qa-checklist.sh
          shellcheck scripts/check-real-cv-default.sh

  # ─────────────────────────────────────────────
  # 6. CV detector quality gate
  #    Runs the full Helios CV test matrix on every PR.
  #    Hard thresholds (see docs/ci-quality-gates.md):
  #      ACCURACY_FLOOR      100% scenario pass rate
  #      FALSE_POSITIVE_CAP  0 false-positive guard failures
  #      LOCKOUT_CORRECTNESS 100% anti-cheat block pass rate
  #    Artifacts uploaded regardless of gate result.
  #
  #    Required repository configuration:
  #      vars.HELIOS_REPO   — GitHub repo for pt-helios (e.g. "your-org/pt-helios")
  #      vars.HELIOS_REF    — Branch to check out (default: "feat/helios-cv")
  #      secrets.HELIOS_GITHUB_TOKEN — PAT with read access to HELIOS_REPO
  # ─────────────────────────────────────────────
  cv-quality-gate:
    name: CV detector quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pt-orion
        uses: actions/checkout@v4

      - name: Checkout pt-helios (CV source)
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.HELIOS_REPO }}
          ref: ${{ vars.HELIOS_REF || 'feat/helios-cv' }}
          path: pt-helios
          token: ${{ secrets.HELIOS_GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enforce REAL_CV_REQUIRED gate
        run: bash scripts/check-real-cv-default.sh pt-helios

      - name: Install Helios CV dependencies
        working-directory: pt-helios/apps/mobile
        run: npm ci

      - name: Run CV test suite (Jest JSON)
        working-directory: pt-helios/apps/mobile
        # Jest exits non-zero on test failures; capture output regardless.
        # --outputFile writes JSON to the workspace root for the next step.
        run: |
          npx jest \
            --testPathPattern="cv" \
            --json \
            --outputFile="${GITHUB_WORKSPACE}/jest-cv-results.json" \
            --runInBand \
            2>/dev/null || true

      - name: Verify Jest output was produced
        run: |
          if [[ ! -s jest-cv-results.json ]]; then
            echo "ERROR: Jest produced no JSON output. Check Helios CV test setup."
            exit 1
          fi
          echo "Jest output: $(wc -c < jest-cv-results.json) bytes"

      - name: Enforce quality gates and generate artifacts
        # Exit code 1 = threshold violation → job fails (gate enforcement).
        # Exit code 2 = setup error (parse failure, missing input).
        # Artifacts are written to ./artifacts/ regardless of gate result.
        run: node scripts/cv-generate-artifacts.js jest-cv-results.json

      - name: Upload CV diagnostics artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cv-quality-gate-${{ github.run_id }}
          path: |
            artifacts/summary.json
            artifacts/junit.xml
            artifacts/quality-report.md
          retention-days: 30
          if-no-files-found: warn

  # ─────────────────────────────────────────────

  # ─────────────────────────────────────────────
  # 7. Atlas+Helios fixture parity smoke (no external creds)
  # ─────────────────────────────────────────────
  atlas-helios-fixture-smoke:
    name: Atlas+Helios fixture parity smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run fixture-based parity smoke
        run: bash scripts/run-atlas-helios-smoke-matrix.sh fixtures
      - name: Upload parity artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-helios-parity-fixture-${{ github.run_id }}
          path: |
            artifacts/atlas-helios-parity.json
            artifacts/atlas-helios-parity.md
          retention-days: 30
          if-no-files-found: warn

  # All-green gate (branch protection target)
  # ─────────────────────────────────────────────
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs:
      - lint-openapi
      - validate-schemas
      - validate-events
      - artefact-check
      - shellcheck
      - cv-quality-gate
      - atlas-helios-fixture-smoke
    steps:
      - run: echo "All CI checks passed."
