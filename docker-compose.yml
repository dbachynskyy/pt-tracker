version: "3.9"

services:
  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    environment:
      SECRET_KEY: change-me-in-production
      CORS_ORIGINS: '["http://localhost:8081","exp://localhost:8081","http://localhost:19006"]'
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
